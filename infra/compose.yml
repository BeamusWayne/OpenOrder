services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openorder
      POSTGRES_PASSWORD: openorder
      POSTGRES_DB: openorder
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openorder -d openorder"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
